server:
  port: 9056
  servlet:
    context-path: /

spring:
  application:
    name: gx-etl-springboot
  datasource:
    driver-class-name: dm.jdbc.driver.DmDriver
    url: jdbc:dm://127.0.0.1:5236/CASIC_ASSESS?schema=SYSDBA&compatibleMode=mysql
    username: CASIC_ASSESS
    password: 123456789
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-empty-string-as-null-object: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.gx.etl: debug
    com.baomidou.mybatisplus: debug

# 文件上传配置
file:
  upload:
    dir: d:/project/ai/vs/03/backend/uploads

# 批量执行配置
batch:
  execution:
    # 并行执行的线程数（流程批处理：每个流程批同时占用2个连接=表输入+表输出，
    # 动态数据源Hikari池为20/数据源，此值不要超过10；与引接的 scheme.ingest.parallel-size 相互独立）
    parallel-size: 4

# 方案数据引接配置
scheme:
  ingest:
    # 引接并行线程数（任务按实例展开；每个线程同时占用1个MySQL连接+1个达梦连接，
    # 动态数据源Hikari池上限为10/数据源，此值不要超过10）
    parallel-size: 6
    # 达梦数据表所在 schema：数据表已从 ETL 迁移到 CASIC_ASSESS（2026-09-26）。
    # 引接连接(T_DATABASE id=1)账号默认 schema 不一定是数据表所在库，代码统一 SET SCHEMA 此值。
    # 后续若库再迁移，只改这里，不要改代码。
    dm-schema: CASIC_ASSESS
