<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>真实TCP/UDP测试</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@7.0.0/lib/stomp.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial; padding: 20px; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #00d2ff; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .card h2 { margin-top: 0; color: #00d2ff; font-size: 18px; }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; }
        .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(0,0,0,0.3); color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #00d2ff; }
        select option { background: #1a1a2e; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #00d2ff, #3a7bd5); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,210,255,0.4); }
        .btn-danger { background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; }
        .btn-success { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .quick-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .quick-btns .btn { padding: 8px 16px; font-size: 13px; }
        .log-container { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 15px; max-height: 400px; overflow-y: auto; }
        .log-item { padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 3px solid #00d2ff; background: rgba(255,255,255,0.05); animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .log-item.tcp { border-left-color: #00d2ff; }
        .log-item.udp { border-left-color: #ffa500; }
        .log-item.send { border-left-color: #00ff88; }
        .log-item.receive { border-left-color: #ff6b6b; }
        .log-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .log-time { color: #888; font-size: 12px; }
        .log-tag { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .log-tag.tcp { background: rgba(0,210,255,0.3); }
        .log-tag.udp { background: rgba(255,165,0,0.3); }
        .log-tag.send { background: rgba(0,255,136,0.3); }
        .log-tag.receive { background: rgba(255,107,107,0.3); }
        .log-msg { word-break: break-all; }
        .empty-tip { text-align: center; color: #666; padding: 40px; }
        .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
        .status.online { background: #00ff88; box-shadow: 0 0 8px #00ff88; }
        .status.offline { background: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 真实 TCP/UDP 测试</h1>
        <p class="subtitle">直接连接到 TCP:9090 / UDP:9091 端口，验证真实网络通信</p>

        <!-- 连接状态 -->
        <div class="card">
            <h2>📡 连接状态</h2>
            <div style="display: flex; gap: 30px;">
                <div><span class="status offline" id="wsStatus"></span> WebSocket: <span id="wsStatusText">未连接</span></div>
                <div><span class="status offline" id="tcpStatus"></span> TCP Server: <span id="tcpStatusText">未知</span></div>
                <div><span class="status offline" id="udpStatus"></span> UDP Server: <span id="udpStatusText">未知</span></div>
            </div>
        </div>

        <!-- TCP发送 -->
        <div class="card">
            <h2>📤 TCP 真实发送 (端口 9090)</h2>
            <div class="form-row">
                <div class="form-group" style="flex: 3;">
                    <label>消息内容</label>
                    <input type="text" id="tcpMessage" value="Hello TCP Server!" placeholder="输入TCP消息">
                </div>
                <div class="form-group" style="flex: 1; display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="sendRealTCP()">发送TCP</button>
                </div>
            </div>
            <div class="quick-btns">
                <button class="btn btn-success" onclick="quickSendTCP('设备上线通知')">设备上线</button>
                <button class="btn btn-success" onclick="quickSendTCP('传感器数据:25.5℃')">传感器</button>
                <button class="btn btn-success" onclick="quickSendTCP('告警:温度过高')">告警</button>
            </div>
        </div>

        <!-- UDP发送 -->
        <div class="card">
            <h2>📤 UDP 真实发送 (端口 9091)</h2>
            <div class="form-row">
                <div class="form-group" style="flex: 3;">
                    <label>消息内容</label>
                    <input type="text" id="udpMessage" value="Hello UDP Server!" placeholder="输入UDP消息">
                </div>
                <div class="form-group" style="flex: 1; display: flex; align-items: flex-end;">
                    <button class="btn btn-primary" style="width: 100%;" onclick="sendRealUDP()">发送UDP</button>
                </div>
            </div>
            <div class="quick-btns">
                <button class="btn btn-success" onclick="quickSendUDP('心跳包')">心跳</button>
                <button class="btn btn-success" onclick="quickSendUDP('GPS坐标:39.9,116.4')">GPS</button>
                <button class="btn btn-success" onclick="quickSendUDP('日志:系统正常运行')">日志</button>
            </div>
        </div>

        <!-- 实时日志 -->
        <div class="card">
            <h2>📥 实时日志 (WebSocket推送)</h2>
            <div class="log-container" id="logContainer">
                <div class="empty-tip">等待连接WebSocket...</div>
            </div>
        </div>
    </div>

    <script>
        let stompClient = null;
        const logs = [];

        // 连接WebSocket
        function connectWebSocket() {
            const socket = new SockJS('http://127.0.0.1:9056/ws');
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function(frame) {
                document.getElementById('wsStatus').className = 'status online';
                document.getElementById('wsStatusText').textContent = '已连接';
                document.getElementById('tcpStatus').className = 'status online';
                document.getElementById('tcpStatusText').textContent = '运行中';
                document.getElementById('udpStatus').className = 'status online';
                document.getElementById('udpStatusText').textContent = '运行中';

                // 订阅日志
                stompClient.subscribe('/topic/network-logs', function(message) {
                    const log = JSON.parse(message.body);
                    logs.unshift(log);
                    if (logs.length > 100) logs.pop();
                    renderLogs();
                });

                addLocalLog('WebSocket连接成功', 'success');
            }, function(error) {
                document.getElementById('wsStatus').className = 'status offline';
                document.getElementById('wsStatusText').textContent = '连接失败';
                setTimeout(connectWebSocket, 5000);
            });
        }

        // 发送真实TCP（通过API）
        async function sendRealTCP() {
            const message = document.getElementById('tcpMessage').value;
            if (!message) return;

            try {
                const res = await fetch('http://127.0.0.1:9056/v1/network/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ protocol: 'TCP', message })
                });
                const data = await res.json();
                if (data.success) {
                    addLocalLog(`TCP发送成功: ${message}`, 'send');
                }
            } catch (err) {
                addLocalLog(`TCP发送失败: ${err.message}`, 'error');
            }
        }

        // 发送真实UDP（通过API）
        async function sendRealUDP() {
            const message = document.getElementById('udpMessage').value;
            if (!message) return;

            try {
                const res = await fetch('http://127.0.0.1:9056/v1/network/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ protocol: 'UDP', message })
                });
                const data = await res.json();
                if (data.success) {
                    addLocalLog(`UDP发送成功: ${message}`, 'send');
                }
            } catch (err) {
                addLocalLog(`UDP发送失败: ${err.message}`, 'error');
            }
        }

        function quickSendTCP(msg) {
            document.getElementById('tcpMessage').value = msg;
            sendRealTCP();
        }

        function quickSendUDP(msg) {
            document.getElementById('udpMessage').value = msg;
            sendRealUDP();
        }

        function addLocalLog(msg, type) {
            logs.unshift({
                time: new Date().toLocaleTimeString(),
                protocol: 'SYS',
                direction: type.toUpperCase(),
                message: msg,
                isLocal: true
            });
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logContainer');
            if (logs.length === 0) {
                container.innerHTML = '<div class="empty-tip">暂无日志</div>';
                return;
            }

            container.innerHTML = logs.slice(0, 50).map(log => `
                <div class="log-item ${log.protocol.toLowerCase()} ${log.direction.toLowerCase()}">
                    <div class="log-header">
                        <span class="log-time">${log.time || log.createTime}</span>
                        <div>
                            <span class="log-tag ${log.protocol.toLowerCase()}">${log.protocol}</span>
                            <span class="log-tag ${log.direction.toLowerCase()}">${log.direction === 'SEND' ? '发送' : '接收'}</span>
                        </div>
                    </div>
                    <div class="log-msg">${log.message}</div>
                    ${log.response ? `<div style="color: #888; font-size: 12px; margin-top: 5px;">响应: ${log.response}</div>` : ''}
                </div>
            `).join('');
        }

        // 启动
        connectWebSocket();
    </script>
</body>
</html>
